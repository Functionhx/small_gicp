<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="1398" height="698" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="700" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#24292f">Retire the kd-tree</text>
  <text x="700" y="80" text-anchor="middle" font-size="15" fill="#57606a">a kd-tree is optimal for one CPU thread doing latency-bound queries — it is the wrong shape for a GPU</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/>
    </marker>
  </defs>

  <!-- ============================ left: CPU ============================ -->
  <text x="330" y="130" text-anchor="middle" font-size="19" font-weight="700" fill="#24292f">CPU small_gicp</text>

  <rect x="180" y="150" width="300" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="330" y="182" text-anchor="middle" font-size="16" fill="#24292f">point cloud</text>
  <line x1="330" y1="202" x2="330" y2="228" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="180" y="232" width="300" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="330" y="258" text-anchor="middle" font-size="16" fill="#24292f">kd-tree build</text>
  <text x="330" y="277" text-anchor="middle" font-size="12.5" fill="#8b949e">serial &#183; pointer-chasing &#183; branch-heavy</text>
  <line x1="330" y1="284" x2="330" y2="310" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="180" y="314" width="300" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="330" y="340" text-anchor="middle" font-size="16" fill="#24292f">kNN for covariances</text>
  <text x="330" y="359" text-anchor="middle" font-size="12.5" fill="#8b949e">tree traversal per point</text>
  <line x1="330" y1="366" x2="330" y2="392" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="180" y="396" width="300" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="330" y="422" text-anchor="middle" font-size="16" fill="#24292f">NN per correspondence</text>
  <text x="330" y="441" text-anchor="middle" font-size="12.5" fill="#8b949e">per point, per LM iteration</text>
  <line x1="330" y1="448" x2="330" y2="474" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="180" y="478" width="300" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="330" y="510" text-anchor="middle" font-size="16" fill="#24292f">LM optimization (double)</text>

  <text x="330" y="576" text-anchor="middle" font-size="15" fill="#57606a">43.9 msec / frame &#183; Ryzen 9 9950X</text>

  <!-- ============================ arrow ============================ -->
  <line x1="620" y1="350" x2="770" y2="350" stroke="#76b900" stroke-width="4" marker-end="url(#g)"/>
  <text x="695" y="325" text-anchor="middle" font-size="15" font-weight="600" fill="#76b900">GPU redesign</text>
  <text x="695" y="382" text-anchor="middle" font-size="13" fill="#57606a">data structure first</text>

  <!-- ============================ right: GPU ============================ -->
  <text x="1070" y="130" text-anchor="middle" font-size="19" font-weight="700" fill="#24292f">small_gicp-cuda</text>

  <rect x="920" y="150" width="300" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1070" y="182" text-anchor="middle" font-size="16" fill="#24292f">point cloud</text>
  <line x1="1070" y1="202" x2="1070" y2="228" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="920" y="232" width="300" height="52" rx="8" fill="#ddf4e0" stroke="#76b900"/>
  <text x="1070" y="258" text-anchor="middle" font-size="16" fill="#24292f">voxelize + one radix sort</text>
  <text x="1070" y="277" text-anchor="middle" font-size="12.5" fill="#57606a">flat &#183; coalesced &#183; branch-free</text>
  <line x1="1070" y1="284" x2="1070" y2="310" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="920" y="314" width="300" height="52" rx="8" fill="#ddf4e0" stroke="#76b900"/>
  <text x="1070" y="340" text-anchor="middle" font-size="16" fill="#24292f">sorted buckets + O(1) hash</text>
  <text x="1070" y="359" text-anchor="middle" font-size="12.5" fill="#57606a">one index for every stage</text>
  <line x1="1070" y1="366" x2="1070" y2="392" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="920" y="396" width="300" height="52" rx="8" fill="#ddf4e0" stroke="#76b900"/>
  <text x="1070" y="422" text-anchor="middle" font-size="16" fill="#24292f">warp-cooperative search</text>
  <text x="1070" y="441" text-anchor="middle" font-size="12.5" fill="#57606a">shells &#183; windows &#183; shuffle reduce</text>
  <line x1="1070" y1="448" x2="1070" y2="474" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="920" y="478" width="300" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1070" y="510" text-anchor="middle" font-size="16" fill="#24292f">GICP / VGICP + LM (double)</text>

  <text x="1070" y="576" text-anchor="middle" font-size="15" fill="#1a7f37" font-weight="600">6.0 msec / frame &#183; RTX 4070 &#183; 7.3&#215;</text>
</svg>
